name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: ESLint
              run: npm run lint

            - name: Prettier (check formatting)
              run: npm run format:check

            - name: Unit tests
              run: npm test

            - name: Validate manifest.json
              run: jq empty src/manifest.json
